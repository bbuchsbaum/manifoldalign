      nightly_files: [tests/testthat/test-toy-manifold-benchmarks.R]
      mandatory_tests: ["tests/testthat/test_linear_sim_embed_consistency.R::C++ LSE agrees with an independent R L-BFGS-B reference"]
      release_evidence: [docs/evidence/alignment-tournament-v2/raw_results.csv]
      known_gaps: [metamorphic_coverage_missing, multi_seed_accuracy_missing, scale_evidence_missing]
    - method: generalized_procrustes
