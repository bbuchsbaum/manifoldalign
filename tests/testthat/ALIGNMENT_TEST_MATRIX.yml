      mandatory_tests: ["tests/testthat/test-generalized_procrustes.R::generalized_procrustes recovers template up to global rotation"]
      release_evidence: []
      known_gaps: [approximation_budget_missing, comparative_accuracy_missing, scale_evidence_missing]
    - method: grasp
