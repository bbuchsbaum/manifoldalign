fixtures:
  spiral_two_domain:
    generator: spiral_two_domain
    params:
      n: 100
      noise: 0.05
    applies_to:
    - gpca_align
    - grasp
    - kema
    invariants:
    - structure
    - finite
    - subspace
    - eigenvalues
  linear_maps:
    generator: linear_maps
    params:
      n: 80
      noise: 0.01
    applies_to:
    - gpca_align
    - cone_align
    - lowrank_align
    - linear_sim_embed
    invariants:
    - structure
    - finite
    - similarity_preservation
  anchor_partial_overlap:
    generator: anchor_partial_overlap
    params: {}
    applies_to:
    - parrot
    - cone_align
    - kema
    invariants:
    - structure
    - anchors
    - ot_marginals
  graph_cycle_mismatch:
    generator: graph_cycle_mismatch
    params: {}
    applies_to:
    - parrot
    - grasp
    - token_ot_graph_align
    invariants:
    - structure
    - ot_marginals
    - assignment
  high_dim_sparse:
    generator: high_dim_sparse
    params:
      n: 60
      p: 500
    applies_to:
    - gpca_align
    - grasp_multiset
    invariants:
    - finite
    - psd
    - densification
  noisy_labels:
    generator: noisy_labels
    params:
      imbalance: 0.7
    applies_to:
    - cone_align
    - pseudolabel
    invariants:
    - balancing
    - structure
  singular_block:
    generator: singular_block
    params: {}
    applies_to:
    - gpca_align
    - kema
    invariants:
    - rank_warning
  large_ot_cost:
    generator: large_ot_cost
    params:
      n: 40
      tau_values:
      - 0.001
      - 0.01
      - 0.1
    applies_to:
    - parrot
    - gromov_wasserstein
    - fpgw
    invariants:
    - ot_marginals
    - solver_equivalence
  task_partial_observation:
    generator: task_partial_observation
    params:
      missing_fraction: 0.3
    applies_to:
    - generalized_procrustes
    invariants:
    - task_recovery
    - convergence
  dual_graphs_structural:
    generator: dual_graphs_structural
    params:
      n: 50
    applies_to:
    - gromov_wasserstein
    - fpgw
    invariants:
    - structure_preservation
    - ot_marginals
  multi_modal_views:
    generator: multi_modal_views
    params:
      n: 70
      views: 3
    applies_to:
    - coupled_diagonalization
    invariants:
    - structure
    - orthonormality
  attributed_graph_v2_frozen:
    generator: synthetic_graph_alignment_case_v2
    params:
      development_manifest: graph_alignment_v2_development_manifest.csv
      final_manifest: graph_alignment_v2_final_manifest.csv
      final_cases: 42
      final_accuracy_cases: 30
      overlap_regimes: [closed_world, partial_overlap]
    applies_to:
    - rapid_ma
    - token_ot_graph_align
    - spectral_mnn_align
    - ssma_align
    - global_geo_align
    - kema
    - gpca_align
    - lowrank_align
    - grasp
    - cone_align
    - parrot
    - gromov_wasserstein
    - fpgw
    - linear_sim_embed
    invariants:
    - supplied_weighted_relations
    - correspondence_truth
    - overlap_private_masks
    - perturbation_severity
    - immutable_hashes
    - no_final_tuning
    - complete_method_case_grid
    - typed_failures_and_applicability
    - intent_to_run_denominators
    - external_runtime_and_peak_rss
    - paired_effects_and_pareto_fronts
  governed_real_alignment_v1:
    generator: governed_real_alignment_cases
    params:
      task_manifest: real_alignment_manifest.csv
      artifact_manifest: real_alignment_artifacts.csv
      remote_sensing_split: culture10-v4.2-blocked
      ci_evidence_scope: ci_schema_only
      release_evidence_scope: full_frozen_split
    applies_to:
    - rapid_ma
    - token_ot_graph_align
    - ssma_align
    - gpca_align
    - lowrank_align
    - grasp
    - cone_align
    - parrot
    - fpgw
    invariants:
    - source_license_and_checksum
    - observed_weighted_relations
    - exact_row_identity
    - natural_partial_overlap
    - unequal_domain_sizes
    - blocked_inductive_split
    - no_final_label_leakage
    - dataset_algorithm_failure_separation
