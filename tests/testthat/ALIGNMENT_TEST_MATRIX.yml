# Enforced by tools/tests/test-alignment-oracle-ci.R and tools/run-alignment-test-tier.R.
# Inline lists keep this critical schema readable with base R, so validating
# the test contract never depends on an optional YAML package.
ci_contract:
  schema_version: 1
  allowed_families: [contract, oracle, invariant, metamorphic, adversarial, regression, approximation, benchmark, stress]
  stable_required_families: [contract, oracle, invariant, metamorphic, adversarial, regression, approximation]
  forbidden_tautologies: [nonnegative_correct_count, nonnegative_length, lower_bound_only_accuracy]
  method_records:
    - method: rapid_ma
      families: [contract, oracle, invariant, metamorphic, adversarial, regression, approximation, benchmark, stress]
      pr_files: [tests/testthat/test-rapid-ma.R, tests/testthat/test-rapid-ma-uot.R, tests/testthat/test-rapid-ma-relations.R, tests/testthat/test-graph-benchmark-registry.R, tests/testthat/test-real-alignment-benchmarks.R]
      nightly_files: [tests/testthat/test-rapid-ma-benchmark.R]
      mandatory_tests: ["tests/testthat/test-rapid-ma-uot.R::full-support sparse and dense UOT solutions agree", "tests/testthat/test-graph-benchmark-registry.R::supplied-edge mutations change only native topology adapter inputs", "tests/testthat/test-real-alignment-benchmarks.R::real network cases preserve observed structure and exact identities"]
      release_evidence: [docs/rapid-ma-validation-summary.csv, docs/rapid-ma-scaling-summary.csv, docs/rapid-ma-matching-summary.csv, inst/benchmarks/graph_alignment_v2_final_manifest.csv, docs/evidence/alignment-tournament-v2/raw_results.csv, docs/evidence/alignment-tournament-v2/INTERPRETATION.md]
      known_gaps: [position_gated_fusion_missing, blocked_inductive_gate_failed, million_node_gate_failed]
    - method: token_ot_graph_align
      families: [contract, oracle, invariant, metamorphic, adversarial, regression, approximation, benchmark]
      pr_files: [tests/testthat/test-token-ot-graph-align-contracts.R, tests/testthat/test-real-alignment-benchmarks.R]
      nightly_files: []
      mandatory_tests: ["tests/testthat/test-token-ot-graph-align-contracts.R::sparse Sinkhorn matches dense Sinkhorn when fully connected (oracle test)"]
      release_evidence: [docs/evidence/alignment-tournament-v2/raw_results.csv]
      known_gaps: [scale_evidence_stale]
    - method: spectral_mnn_align
      families: [contract, invariant, metamorphic, regression]
      pr_files: [tests/testthat/test-spectral_mnn_align.R]
      nightly_files: []
      mandatory_tests: ["tests/testthat/test-spectral_mnn_align.R::spectral_mnn_align respects explicit correspondences"]
      release_evidence: [docs/evidence/alignment-tournament-v2/raw_results.csv]
      known_gaps: [exact_oracle_missing, adversarial_coverage_missing, approximation_budget_missing]
    - method: ssma_align
      families: [contract, oracle, invariant, metamorphic, adversarial, regression, approximation]
      pr_files: [tests/testthat/test-ssma-align.R, tests/testthat/test-ssma-linear-constraints.R]
      nightly_files: []
      mandatory_tests: ["tests/testthat/test-ssma-align.R::ssma_align operator solver matches reduced-solver subspace on same fixture", "tests/testthat/test-ssma-linear-constraints.R::linear constraint quadratic and operator match an independent outer-product oracle", "tests/testthat/test-ssma-linear-constraints.R::SSMA constrained eigenproblem matches a tiny independently assembled oracle", "tests/testthat/test-ssma-linear-constraints.R::SSMA constrained dense and operator solvers agree on unequal domains", "tests/testthat/test-ssma-linear-constraints.R::SSMA base eigen fallback returns the smallest spectrum before truncation"]
      release_evidence: [docs/evidence/alignment-tournament-v2/raw_results.csv]
      known_gaps: [linear_constraint_accuracy_benchmark_missing, linear_constraint_scaling_evidence_missing]
    - method: global_geo_align
      families: [contract, oracle, invariant, metamorphic, adversarial, regression]
      pr_files: [tests/testthat/test-global_geo_align.R]
      nightly_files: []
      mandatory_tests: ["tests/testthat/test-global_geo_align.R::anchor smoothness matches a tiny kNN Laplacian oracle"]
      release_evidence: [docs/evidence/alignment-tournament-v2/raw_results.csv, docs/ALIGNMENT_METHOD_SUNSET_REVIEW.md]
      known_gaps: [approximation_budget_missing, disconnected_landmark_graph_repair, scale_evidence_missing]
    - method: kema
      families: [contract, oracle, invariant, adversarial, regression, approximation, benchmark]
      pr_files: [tests/testthat/test-kema-numerical-validation.R, tests/testthat/test-kema-scalable-smoke.R, tests/testthat/test-toy-manifold-benchmarks-fast.R]
      nightly_files: [tests/testthat/test-toy-manifold-benchmarks.R]
      mandatory_tests: ["tests/testthat/test-kema-scalable-smoke.R::operator KEMA matches the full matrix backend on a toy oracle"]
      release_evidence: [docs/evidence/alignment-tournament-v2/raw_results.csv]
      known_gaps: [metamorphic_coverage_missing, scale_evidence_missing]
    - method: gpca_align
      families: [contract, invariant, adversarial, regression, approximation, benchmark]
      pr_files: [tests/testthat/test-gpca_align.R]
      nightly_files: [tests/testthat/test-toy-manifold-benchmarks.R]
      mandatory_tests: ["tests/testthat/test-gpca_align.R::gpca_align correctly handles cross-domain alignment"]
      release_evidence: [docs/evidence/alignment-tournament-v2/raw_results.csv]
      known_gaps: [independent_oracle_missing, metamorphic_coverage_missing, scale_evidence_missing]
    - method: lowrank_align
      families: [contract, oracle, invariant, regression, approximation]
      pr_files: [tests/testthat/test-lowrank_align.R]
      nightly_files: []
      mandatory_tests: ["tests/testthat/test-lowrank_align.R::createSimFun preserves sparsity and symmetry"]
      release_evidence: [docs/evidence/alignment-tournament-v2/raw_results.csv]
      known_gaps: [metamorphic_coverage_missing, adversarial_coverage_missing, scale_evidence_missing]
    - method: linear_sim_embed
